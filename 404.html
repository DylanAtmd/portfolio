<!DOCTYPE html>
<html lang="fr">
<head>
    <script>(function(){var t=localStorage.getItem("kb-theme")||"dark";document.documentElement.setAttribute("data-theme",t);})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.png">
    <title>404 — Page introuvable · Votre Nom</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        body::after { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(0,212,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.04) 1px,transparent 1px); background-size: 60px 60px; pointer-events: none; z-index: 0; }
        .glow-orb { position: fixed; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle,rgba(0,212,255,0.06) 0%,transparent 70%); top: 50%; left: 50%; transform: translate(-50%,-50%); pointer-events: none; animation: orb-pulse 4s ease-in-out infinite; }
        @keyframes orb-pulse { 0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.6} 50%{transform:translate(-50%,-50%) scale(1.15);opacity:1} }
        .card { position: relative; z-index: 10; text-align: center; padding: 4rem 5rem; background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; max-width: 560px; width: 90%; animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) forwards; }
        .card::before { content: ''; position: absolute; top: 0; left: 10%; right: 10%; height: 1px; background: linear-gradient(90deg,transparent,var(--accent),transparent); }
        .err-code { font-family: var(--font-display); font-size: clamp(6rem,20vw,10rem); line-height: 1; letter-spacing: 0.05em; color: transparent; -webkit-text-stroke: 1.5px var(--accent); position: relative; display: inline-block; margin-bottom: 0.25rem; animation: glitch 5s infinite; }
        .err-code::after { content: "404"; position: absolute; inset: 0; color: var(--accent); opacity: 0.12; transform: translate(3px,3px); font-family: var(--font-display); font-size: inherit; letter-spacing: inherit; }
        @keyframes glitch { 0%,90%,100%{transform:translate(0);filter:none} 92%{transform:translate(-2px,1px);filter:hue-rotate(90deg)} 94%{transform:translate(2px,-1px);filter:hue-rotate(-90deg)} 96%{transform:translate(-1px,2px);filter:none} }
        .err-tag { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: center; gap: 0.6rem; }
        .err-tag::before, .err-tag::after { content: ''; display: block; width: 30px; height: 1px; background: var(--accent); opacity: 0.5; }
        h1 { font-family: var(--font-display); font-size: 2rem; letter-spacing: 0.06em; margin-bottom: 0.75rem; }
        p  { font-size: 0.9rem; color: var(--text-muted); line-height: 1.7; margin-bottom: 2.5rem; }
        .btn-group { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
        .btn-primary { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.85rem 1.75rem; background: var(--accent); color: var(--bg); border: none; border-radius: 5px; text-decoration: none; font-weight: 700; transition: all 0.25s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-primary:hover  { background: #33ddff; box-shadow: 0 6px 24px rgba(0,212,255,0.35); transform: translateY(-2px); }
        .btn-secondary { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.85rem 1.75rem; background: transparent; color: var(--text-muted); border: 1px solid var(--border2); border-radius: 5px; text-decoration: none; transition: all 0.25s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn-secondary:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-glow); transform: translateY(-2px); }
        .status { margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border2); font-family: var(--font-mono); font-size: 0.62rem; color: var(--text-dim); letter-spacing: 0.1em; display: flex; align-items: center; justify-content: center; gap: 0.75rem; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink-dot 1.5s ease-in-out infinite; }
        @keyframes blink-dot { 0%,100%{opacity:1} 50%{opacity:.2} }
        @media (max-width: 500px) { .card { padding: 3rem 2rem; } }
    </style>
</head>
<body>
    <div class="glow-orb"></div>
    <div class="card">
        <div class="err-code">404</div>
        <div class="err-tag">Erreur</div>
        <h1>Page introuvable</h1>
        <p>Cette page n&rsquo;existe pas ou a &eacute;t&eacute; d&eacute;plac&eacute;e.<br>V&eacute;rifie l&rsquo;URL ou retourne &agrave; l&rsquo;accueil.</p>
        <div class="btn-group">
            <a href="index.html" class="btn-primary"><i class="fas fa-home"></i> Accueil</a>
            <a href="javascript:history.back()" class="btn-secondary"><i class="fas fa-arrow-left"></i> Retour</a>
        </div>
        <div class="status"><div class="status-dot"></div><span>ERREUR 404 &mdash; RESSOURCE NON TROUV&Eacute;E</span></div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
